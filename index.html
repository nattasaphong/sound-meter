<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>

<h2>ระบบคลังสินค้า</h2>

<select id="zone">
  <option>A</option>
  <option>B</option>
</select>

<select id="shelf">
  <option>1</option>
  <option>2</option>
</select>

<div id="reader" style="width:300px;"></div>

<script>
function onScanSuccess(decodedText) {
  const zone = document.getElementById("zone").value;
  const shelf = document.getElementById("shelf").value;

  fetch("YOUR_GAS_URL", {
    method: "POST",
    body: JSON.stringify({
      code: decodedText,
      zone: zone,
      shelf: shelf
    })
  });

  alert("บันทึกแล้ว: " + decodedText);
}

let scanner = new Html5QrcodeScanner("reader", { fps: 10 });
scanner.render(onScanSuccess);
</script>

</body>
</html>
